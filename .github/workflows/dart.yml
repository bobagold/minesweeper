name: Dart CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: dart run rive_native:setup --clean --platform macos
      - run: flutter test

  # todo add ios deploy
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: macos-latest
    environment: google-play

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1
        with:
          channel: 'stable'
      - name: Verify Android Java toolchain
        run: |
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          flutter config --jdk-dir="$JAVA_HOME"
          cd android
          ./gradlew --version
      - name: Restore keystore
        # -d on linux, -D on macos
        run: printf '%s' "$SIGNING_KEY" | base64 -D > android/app/key.jks
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      - run: flutter pub get
#      - run: flutter build apk --build-number $GITHUB_RUN_NUMBER
#        env:
#          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
#          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
#          ALIAS: ${{ secrets.ALIAS }}
#          KEY_PATH: key.jks
      - run: flutter build appbundle --build-number $GITHUB_RUN_NUMBER
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PATH: key.jks
#      - run: flutter build ios --release --no-codesign
#      - name: Archive production artifacts - apk
#        uses: actions/upload-artifact@v1
#        with:
#          name: app-release.apk
#          path: build/app/outputs/apk/release/app-release.apk
#      - name: Archive production artifacts - ios
#        uses: actions/upload-artifact@v1
#        with:
#          name: Runner.app
#          path: build/ios/iphoneos/Runner.app
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          # todo extract packageName from AndroidManifest.xml
          packageName: com.actvst.bobagold.minesweeper
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
